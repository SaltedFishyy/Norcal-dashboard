<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线路地图 — NC Ops Console</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/vendor/protomaps-leaflet/protomaps-leaflet.js" defer></script>
  <script type="module" src="/map.js"></script>
</head>
<body>
  <main class="map-page">
    <header class="map-heading">
      <div><p class="eyebrow">NC OPS CONSOLE</p><h1 data-map-text="title">线路地图</h1></div>
      <label><span>片区</span> <select id="map-district" disabled aria-label="片区"></select></label>
      <label><span data-map-text="station">站点</span> <select id="map-station" disabled aria-label="站点"></select></label>
      <a href="/" data-map-text="profiles">线路档案</a>
    </header>
    <p class="snapshot"><span data-map-text="snapshot">DMS 快照，非实时数据</span> · <span data-map-text="updated">更新时间</span>：<span id="map-updated">—</span></p>
    <p id="map-message" role="status" aria-live="polite" data-map-text="loadingStations">正在加载站点…</p>
    <p id="map-basemap-message" role="status" hidden></p>
    <button id="map-retry" type="button" hidden data-map-text="retry">重试</button>
    <div class="map-layout" id="map-content" aria-busy="true">
      <div id="route-map" role="region" aria-label="线路邮编覆盖地图"></div>
      <aside class="map-sidebar">
        <section class="panel" id="map-zip-panel" hidden><div class="map-card-heading" id="map-zip-heading"><h2 data-map-text="currentZip">当前邮编</h2><button id="map-clear" type="button" disabled data-map-text="clear">清除选择</button></div><div id="map-selection" aria-live="polite"></div></section>
        <section class="panel" id="map-summary-panel" hidden><div class="map-card-heading" id="map-summary-heading"><h2 data-map-text="summary">线路概览</h2></div><div id="map-summary" aria-live="polite"></div></section>
        <section class="panel"><h2 data-map-text="route">线路</h2>
          <label for="map-search" data-map-text="search">搜索线路或邮编</label><input id="map-search" type="search" placeholder="搜索线路或邮编" disabled>
          <p id="map-search-hint" class="snapshot" data-map-text="zipHint" hidden>输入完整 5 位邮编可搜索邮编</p>
          <p id="map-search-message" role="status" aria-live="polite"></p>
          <div id="map-routes" class="map-routes" aria-label="线路"></div><p id="map-no-match" data-map-text="noMatch" hidden>未找到匹配线路</p>
        </section>
        <section class="panel"><h2 data-map-text="coverage">地图覆盖率</h2><p id="map-coverage">—</p><p id="map-coverage-count"></p><p id="map-regenerate" hidden></p><p id="map-source"></p></section>
        <details class="panel" id="map-conflicts-details" hidden><summary id="map-conflicts-title"></summary><ul id="map-conflicts"></ul></details>
        <details class="panel" id="map-missing-details"><summary id="map-missing-title">缺少边界的邮编 (0)</summary>
          <table class="map-missing"><thead><tr><th scope="col">ZIP</th><th scope="col" data-map-text="station">站点</th><th scope="col" data-map-text="route">线路</th><th scope="col" data-map-text="reason">原因</th></tr></thead><tbody id="map-missing"></tbody></table>
          <p id="map-missing-empty" hidden data-map-text="noMissing">没有缺少边界的邮编。</p>
        </details>
        <p class="snapshot" data-map-text="boundaryNote">ZCTA 是 USPS ZIP 区域的近似边界，不能用于具体地址的线路分配。</p>
      </aside>
    </div>
    <noscript data-map-text="noscript">请启用 JavaScript 以加载本地线路地图。</noscript>
  </main>
</body>
</html>
