<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美西线路画像</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
  <script type="module" src="/data-status.js"></script>
</head>
<body>
  <main class="profile-page">
    <header class="profile-topbar">
      <p class="console-brand"></p>
      <div class="console-title"><h1 class="sr-only">线路档案</h1></div>
      <nav class="page-nav" aria-label="页面"><a href="/" aria-current="page">线路档案</a><a href="/map">线路地图</a></nav>
      <div class="profile-toolbar">
        <div><label for="profile-district">片区</label><select id="profile-district" disabled></select></div>
        <div><label for="profile-station">站点</label><select id="profile-station" disabled></select></div>
        <div><label for="profile-dsp">DSP</label><select id="profile-dsp" disabled><option value="">全部 DSP</option></select></div>
        <div id="profile-date-field" hidden><label for="profile-date">日期</label><select id="profile-date" disabled></select></div>
      </div>
      <div class="profile-toolbar-actions"><span class="snapshot">DMS 快照，非实时 · 数据更新时间 <span id="updated">—</span></span><div id="profile-data-summary" hidden></div><div id="map-data-actions"></div></div>
    </header>
    <div class="profile-layout">
      <aside class="profile-sidebar" aria-label="线路">
        <h2>线路 <small id="total">—</small></h2>
        <form id="profile-zip-form"><label for="profile-zip" class="sr-only">搜索线路编号或邮编</label><input id="profile-zip" placeholder="搜索线路编号或邮编" autocomplete="off"><button type="submit">搜索</button></form>
        <div id="profile-zip-result" role="status" aria-live="polite"></div>
        <div class="profile-sort" role="group" aria-label="线路排序">
          <button id="sort-name" type="button" aria-pressed="true">线路名<span aria-hidden="true"></span></button>
          <button id="sort-pickup_volume" type="button" aria-pressed="false">件量<span aria-hidden="true"></span></button>
          <button id="sort-pph" type="button" aria-pressed="false">PPH<span aria-hidden="true"></span></button>
          <button id="sort-price" type="button" aria-pressed="false" title="首票价格 0–1(lb) / Quotation for the First Parcel 0–1(lb)">首票价格<span aria-hidden="true"></span></button>
          <button id="sort-route_difficulty" type="button" aria-pressed="false">难度<span aria-hidden="true"></span></button>
        </div>
        <section id="profiles" aria-label="线路列表" aria-busy="true">
          <div class="status" role="status" aria-live="polite"><p id="message">加载中…</p><button id="retry" type="button" hidden>重试</button></div>
          <div id="profile-routes"></div>
        </section>
      </aside>
      <div class="profile-detail-pane">
        <div class="profile-banners">
          <section id="data-status" class="data-status" aria-label="数据状态"></section>
          <div id="profile-date-notice" class="view-date-notice" hidden><span id="profile-date-text"></span> · <button id="profile-date-latest" type="button">回到最新</button> · 首票价格为当前报价</div>
        </div>
        <section id="route-detail" aria-labelledby="detail-title">
          <div class="detail-heading pl-heading"><span id="detail-swatch" aria-hidden="true"></span><h2 id="detail-title">线路详情</h2><span id="detail-difficulty"></span><p id="detail-summary"></p></div>
          <div id="detail-content" aria-live="polite"></div>
        </section>
      </div>
    </div>
    <noscript>请启用 JavaScript 以从本地服务器加载线路画像。</noscript>
  </main>
</body>
</html>
